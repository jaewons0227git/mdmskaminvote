<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinVote - 참여하기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo elms-font">MinVote</a>
        <ul class="nav-links">
            <li><a href="dashboard.html">대시보드</a></li>
            <li><a href="#" onclick="checkAuthAndGo('survey-create.html')">설문조사</a></li>
            <li><a href="join.html">설문참여</a></li>
        </ul>
        <div id="auth-section"></div>
    </nav>

    <div id="join-box" style="max-width:450px; margin: 80px auto; text-align:center; padding: 0 20px;">
        <h1 class="elms-font" style="font-size:3rem; margin-bottom:10px;">Join</h1>
        <p style="color:#888; margin-bottom:40px;">참여 코드(또는 보안 코드)를 입력하세요.</p>
        <input type="text" id="joinCode" placeholder="CODE 입력" style="font-size:1.5rem; text-align:center; padding:20px; border:2px solid #000; letter-spacing: 2px; text-transform:uppercase;">
        <button class="btn-pill btn-black" style="width:100%; margin-top:20px; padding:15px; font-size:1.1rem;" onclick="checkCode()">입장하기</button>
    </div>

    <div id="survey-box" style="max-width:600px; margin: 40px auto; padding: 0 20px; display:none;">
        <h2 id="sTitle" class="elms-font" style="font-size:2rem; margin-bottom:20px;"></h2>
        <div id="qList"></div>
        <button class="btn-pill btn-black" style="width:100%; margin-top:30px; padding:15px;" onclick="submit()">제출하기</button>
    </div>

    <div id="loginModal" class="custom-modal">
        <div class="modal-box">
            <h2 class="elms-font" style="margin-bottom:20px; font-size:2rem;">Login</h2>
            <input type="text" id="userId" placeholder="ID">
            <input type="password" id="userPw" placeholder="Password">
            <div class="modal-btns">
                <button class="btn-pill" onclick="Modal.toggleLogin(false)">취소</button>
                <button class="btn-pill btn-black" onclick="handleLogin()">로그인</button>
            </div>
        </div>
    </div>

    <script src="modal.js"></script>
    <script>
        let currentS = null;
        let inputCode = "";

        // [수정] 페이지 로드 시 URL 파라미터 확인 및 로그인 상태 표시
        window.onload = () => {
            const user = localStorage.getItem('minvote_user');
            const authSec = document.getElementById('auth-section');
            if(user) authSec.innerHTML = `<span style="font-weight:700;">${user}님</span>`;
            else authSec.innerHTML = `<button class="btn-pill" onclick="Modal.toggleLogin(true)">Login</button>`;

            // URL의 ?code=값 가져오기
            const urlParams = new URLSearchParams(window.location.search);
            const codeParam = urlParams.get('code');
            if(codeParam) {
                document.getElementById('joinCode').value = codeParam;
            }
        };

        function checkAuthAndGo(url) {
            if(localStorage.getItem('minvote_user')) location.href = url;
            else Modal.toggleLogin(true);
        }

        async function handleLogin() {
            const id = document.getElementById('userId').value;
            // 간단 로그인 처리
            if(id) {
                localStorage.setItem('minvote_user', id);
                location.reload();
            }
        }
        Modal.toggleLogin = function(show) {
             const m = document.getElementById('loginModal');
             if(show) { m.style.display='flex'; setTimeout(()=>m.classList.add('active'),10); }
             else { m.classList.remove('active'); setTimeout(()=>m.style.display='none',300); }
        }

        async function checkCode() {
            inputCode = document.getElementById('joinCode').value.trim().toUpperCase();
            if(!inputCode) return Modal.alert("입력 필요", "코드를 입력해주세요.");
            
            const res = await fetch(`https://jaewondev4.pythonanywhere.com/get-survey?code=${inputCode}`);
            const data = await res.json();
            
            if(data.success) {
                if(data.survey.status === 'closed') return Modal.alert("마감", "이미 종료된 설문입니다.");
                currentS = data.survey;
                renderSurvey();
            } else { await Modal.alert("오류", "존재하지 않거나 유효하지 않은 코드입니다."); }
        }

        function renderSurvey() {
            document.getElementById('join-box').style.display = 'none';
            document.getElementById('survey-box').style.display = 'block';
            document.getElementById('sTitle').innerText = currentS.title;
            const list = document.getElementById('qList');
            list.innerHTML = '';
            
            currentS.questions.forEach((q, i) => {
                const div = document.createElement('div');
                div.style.marginBottom = '25px';
                div.innerHTML = `<p style="font-weight:bold; margin-bottom:10px;">${i+1}. ${q.title}</p>`;
                
                if(q.type === 'text') {
                    div.innerHTML += `<input type="text" class="ans" placeholder="답변 입력">`;
                } else {
                    q.options.forEach(opt => {
                        div.innerHTML += `
                            <label style="display:block; padding:10px; border:1px solid #eee; border-radius:10px; margin-bottom:5px; cursor:pointer;">
                                <input type="radio" name="q${i}" value="${opt}"> ${opt}
                            </label>
                        `;
                    });
                }
                list.appendChild(div);
            });
        }

        async function submit() {
            let answers = [];
            for(let i=0; i<currentS.questions.length; i++) {
                const q = currentS.questions[i];
                let val = "";
                if(q.type === 'text') val = document.querySelectorAll('.ans')[i]?.value || "";
                else {
                    const sel = document.querySelector(`input[name="q${i}"]:checked`);
                    val = sel ? sel.value : "";
                }
                if(q.required && !val) return Modal.alert("미입력", `${i+1}번 항목에 답변해주세요.`);
                answers.push(val);
            }
            
            const res = await fetch("https://jaewondev4.pythonanywhere.com/submit-response", {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ code: inputCode, answers, timestamp: new Date().toISOString() })
            });
            const data = await res.json();
            
            if(data.success) { 
                await Modal.alert("완료", "제출되었습니다."); 
                location.href="index.html"; 
            } else { 
                await Modal.alert("오류", data.message || "제출 중 오류가 발생했습니다.");
            }
        }
    </script>
</body>
</html>
