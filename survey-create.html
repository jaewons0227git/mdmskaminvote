<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>MinVote - 설문 관리</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo elms-font">MinVote</a>
        <ul class="nav-links">
            <li><a href="dashboard.html">대시보드</a></li>
            <li><a href="survey-create.html">설문조사</a></li>
            <li><a href="join.html">설문참여</a></li>
        </ul>
        <div id="auth-section"></div>
    </nav>

    <div style="max-width: 800px; margin: 60px auto; padding: 0 20px;">
        <h2 id="pageTitle" class="elms-font" style="font-size: 2.5rem; margin-bottom: 10px;">Create Survey</h2>
        <p style="color:#888; margin-bottom:40px;">문항을 드래그하여 순서를 바꿀 수 있습니다.</p>
        
        <input type="text" id="surveyTitle" placeholder="설문 제목을 입력하세요" style="font-size: 1.8rem; border:none; border-bottom: 2px solid #eee; background:none; border-radius:0; margin-bottom:40px;">
        
        <div id="questions-list"></div>

        <div style="display:flex; gap:10px; margin-top:20px;">
            <button class="btn-pill" onclick="addQuestion('text')">+ 단답형 추가</button>
            <button class="btn-pill" onclick="addQuestion('choice')">+ 객관식 추가</button>
        </div>

        <button class="btn-pill btn-black" style="width: 100%; margin-top: 50px; padding: 20px;" onclick="saveSurvey()">설문 저장하기</button>
    </div>

    <div id="successModal" class="custom-modal">
        <div class="modal-box">
            <h3 class="elms-font" style="font-size:2rem; margin-bottom:10px;">Success!</h3>
            <p style="color:#666; margin-bottom:20px;">설문이 생성되었습니다.<br>참여자들에게 아래 코드를 공유하세요.</p>
            
            <div style="background:#f5f5f5; padding:20px; border-radius:15px; margin-bottom:20px; border:2px dashed #ccc;">
                <span id="createdCode" style="font-size:2.5rem; font-weight:800; letter-spacing: 5px;"></span>
            </div>
            
            <button class="btn-pill" style="margin-bottom:20px;" onclick="copyCode()">📋 코드 복사하기</button>

            <div class="modal-btns">
                <button class="btn-pill btn-black" style="width:100%" onclick="location.href='dashboard.html'">확인 (대시보드로 이동)</button>
            </div>
        </div>
    </div>

    <script src="modal.js"></script>
    <script>
        let questions = [];
        const user = localStorage.getItem('minvote_user');
        const urlParams = new URLSearchParams(window.location.search);
        const editCode = urlParams.get('edit');

        // 드래그 앤 드롭
        const el = document.getElementById('questions-list');
        Sortable.create(el, {
            animation: 150, handle: '.q-card',
            onEnd: function() {
                const newOrder = [];
                document.querySelectorAll('.q-card').forEach(card => newOrder.push(questions[card.dataset.index]));
                questions = newOrder; render();
            }
        });

        window.onload = async () => {
            if(!user) location.href = 'index.html';
            if(editCode) {
                document.getElementById('pageTitle').innerText = "Edit Survey";
                const res = await fetch(`https://jaewondev4.pythonanywhere.com/get-survey?code=${editCode}`);
                const data = await res.json();
                if(data.success) {
                    document.getElementById('surveyTitle').value = data.survey.title;
                    questions = data.survey.questions;
                    render();
                }
            }
            document.getElementById('auth-section').innerHTML = `<span style="font-weight:700;">${user}님</span>`;
        };

        function addQuestion(type) {
            questions.push({ type, title: '', options: type === 'choice' ? ['', ''] : [], required: false });
            render();
        }

        function render() {
            const list = document.getElementById('questions-list');
            list.innerHTML = '';
            questions.forEach((q, i) => {
                const div = document.createElement('div');
                div.className = 'q-card';
                div.dataset.index = i;
                div.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size:0.8rem; color:#888; font-weight:bold;">☰ 문항 ${i+1}</span>
                        <button onclick="removeQuestion(${i})" style="color:#e74c3c; border:none; background:none; cursor:pointer; font-size:0.8rem;">삭제</button>
                    </div>
                    <input type="text" placeholder="질문을 입력하세요" value="${q.title}" oninput="questions[${i}].title=this.value">
                    ${q.type === 'choice' ? `
                        <div style="margin-top:10px; padding-left:20px;">
                            ${q.options.map((opt, oi) => `
                                <input type="text" value="${opt}" oninput="questions[${i}].options[${oi}]=this.value" style="width:80%; font-size:0.85rem; margin-bottom:5px;" placeholder="옵션 ${oi+1}">
                            `).join('')}
                            <button class="btn-pill" style="font-size:0.7rem; padding:4px 12px; margin-top:5px;" onclick="questions[${i}].options.push(''); render()">+ 옵션 추가</button>
                        </div>
                    ` : ''}
                    <div style="margin-top:15px; border-top:1px solid #f9f9f9; padding-top:10px;">
                        <label style="font-size:0.85rem; cursor:pointer;">
                            <input type="checkbox" ${q.required ? 'checked' : ''} onchange="questions[${i}].required=this.checked"> 필수 답변 설정
                        </label>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function removeQuestion(i) {
            questions.splice(i, 1);
            render();
        }

        async function saveSurvey() {
            const title = document.getElementById('surveyTitle').value;
            if(!title) return Modal.alert("오류", "설문 제목을 입력해주세요.");
            if(questions.length === 0) return Modal.alert("오류", "최소 1개 이상의 질문을 생성해주세요.");

            const res = await fetch("https://jaewondev4.pythonanywhere.com/create-survey", {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id: user, code: editCode, title, questions })
            });
            const data = await res.json();
            
            if(data.success) {
                // 저장 성공 시 모달 띄우기
                // editCode가 있으면 수정이므로 해당 코드 사용, 없으면 새로 생성된 data.code 사용
                const finalCode = editCode || data.code; 
                document.getElementById('createdCode').innerText = finalCode;
                
                const m = document.getElementById('successModal');
                m.style.display = 'flex'; 
                setTimeout(() => m.classList.add('active'), 10);
            } else {
                Modal.alert("오류", "저장에 실패했습니다.");
            }
        }

        function copyCode() {
            const code = document.getElementById('createdCode').innerText;
            navigator.clipboard.writeText(code).then(() => {
                alert("코드가 복사되었습니다!");
            });
        }
    </script>
</body>
</html>
