<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinVote - 설문조사 만들기</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #ffffff;
            color: #333;
        }

        .elms-font {
            font-family: 'Elms Sans', sans-serif;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        /* 공통 상단바 */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 8%;
            border-bottom: 1px solid #f0f0f0;
            position: sticky;
            top: 0;
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
        }

        .logo { font-size: 1.6rem; color: #000; text-decoration: none; cursor: pointer; }
        .nav-links { list-style: none; display: flex; gap: 2.5rem; align-items: center; }
        .nav-links a { text-decoration: none; color: #555; font-size: 0.95rem; font-weight: 500; cursor: pointer; transition: color 0.2s; }
        .nav-links a:hover { color: #000; }

        .auth-section { display: flex; align-items: center; gap: 1.2rem; }
        .logout-btn, .login-trigger-btn {
            padding: 8px 24px;
            background: transparent;
            color: #000;
            border: 1px solid #000;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        /* 설문 생성 폼 스타일 */
        .container {
            max-width: 700px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .survey-form-card {
            background: #fff;
            padding: 40px;
            border-radius: 30px;
            border: 1px solid #eee;
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
        }

        h2 { margin-bottom: 30px; text-align: center; font-size: 2rem; }

        .input-group { margin-bottom: 25px; }
        .input-group label { display: block; margin-bottom: 10px; font-weight: 600; font-size: 0.9rem; color: #666; }
        
        input[type="text"], textarea {
            width: 100%;
            padding: 16px 20px;
            border: 1px solid #eee;
            border-radius: 15px;
            background: #f9f9f9;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        input:focus { border-color: #000; background: #fff; }

        .add-option-btn {
            background: none;
            border: 1px dashed #ccc;
            width: 100%;
            padding: 12px;
            border-radius: 15px;
            cursor: pointer;
            color: #888;
            margin-top: 10px;
            transition: all 0.2s;
        }

        .add-option-btn:hover { border-color: #000; color: #000; }

        .submit-survey-btn {
            width: 100%;
            padding: 18px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 30px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .submit-survey-btn:hover { transform: scale(1.02); }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo elms-font">MinVote</a>
        <ul class="nav-links">
            <li><a href="index.html">투표만들기</a></li>
            <li><a href="#">전자투표</a></li>
            <li><a href="survey-create.html">설문조사</a></li>
        </ul>
        <div class="auth-section" id="auth-section"></div>
    </nav>

    <div class="container">
        <div class="survey-form-card">
            <h2 class="elms-font">Create Survey</h2>
            <div class="input-group">
                <label>설문 제목</label>
                <input type="text" placeholder="예: 서비스 이용 만족도 조사">
            </div>
            <div class="input-group">
                <label>설문 설명</label>
                <textarea rows="3" placeholder="설문에 대한 간단한 설명을 입력하세요"></textarea>
            </div>
            <hr style="border: 0; border-top: 1px solid #eee; margin: 30px 0;">
            <div id="options-container">
                <label style="display: block; margin-bottom: 10px; font-weight: 600; font-size: 0.9rem; color: #666;">질문 항목</label>
                <input type="text" placeholder="항목 1" style="margin-bottom: 10px;">
                <input type="text" placeholder="항목 2" style="margin-bottom: 10px;">
            </div>
            <button class="add-option-btn">+ 항목 추가</button>
            <button class="submit-survey-btn">설문 등록하기</button>
        </div>
    </div>

    <script>
        window.onload = function() {
            updateAuthUI();
        };

        function handleLogout() {
            localStorage.removeItem('minvote_user');
            location.href = 'index.html'; // 로그아웃 시 홈으로 이동
        }

        function updateAuthUI() {
            const authSection = document.getElementById('auth-section');
            const user = localStorage.getItem('minvote_user');
            if (user) {
                authSection.innerHTML = `
                    <span style="font-size:0.9rem; font-weight:600;">${user}님</span>
                    <button class="logout-btn" onclick="handleLogout()">로그아웃</button>
                `;
            } else {
                // 로그인 안되어있을 경우 홈으로 돌려보내거나 로그인 유도
                alert("로그인이 필요한 서비스입니다.");
                location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
