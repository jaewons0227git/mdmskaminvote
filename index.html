<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>MinVote - Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo elms-font">MinVote</a>
        <ul class="nav-links">
            <li><a href="dashboard.html">대시보드</a></li>
            <li><a href="survey-create.html">설문조사</a></li>
            <li><a href="join.html">설문참여</a></li>
        </ul>
        <div id="auth-section"></div>
    </nav>

    <main style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 80vh; text-align: center; padding: 0 20px;">
        <h1 class="elms-font" style="font-size: 4.5rem; letter-spacing: -2px;">MinVote</h1>
        <p style="font-size: 1.2rem; color: #888; margin-top: 10px;">세련된 방식으로 의견을 모으세요.</p>
        <div style="margin-top: 40px; display: flex; gap: 15px;">
            <a href="survey-create.html" class="btn-pill btn-black" style="padding: 15px 40px;">시작하기</a>
            <a href="join.html" class="btn-pill" style="padding: 15px 40px;">설문 참여</a>
        </div>
    </main>

    <div id="loginModal" class="custom-modal">
        <div class="modal-box">
            <h3 class="elms-font" style="margin-bottom: 20px;">Login</h3>
            <input type="text" id="userId" placeholder="아이디">
            <input type="password" id="userPw" placeholder="비밀번호">
            <div class="modal-btns">
                <button class="btn-pill btn-black" style="width: 100%;" onclick="handleLogin()">로그인</button>
            </div>
            <p style="margin-top:20px; cursor:pointer; font-size:0.8rem; color:#aaa;" onclick="toggleLoginModal(false)">닫기</p>
        </div>
    </div>

    <script src="modal.js"></script>
    <script>
        function toggleLoginModal(show) {
            const m = document.getElementById('loginModal');
            if(show) { m.style.display = 'flex'; setTimeout(()=>m.classList.add('active'),10); }
            else { m.classList.remove('active'); setTimeout(()=>m.style.display='none',300); }
        }

        async function handleLogin() {
            const id = document.getElementById('userId').value;
            const pw = document.getElementById('userPw').value;
            const res = await fetch("https://jaewondev2.pythonanywhere.com/check-access", {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id, password: pw })
            });
            const data = await res.json();
            if(data.success) {
                localStorage.setItem('minvote_user', id);
                location.reload();
            } else { await Modal.alert("로그인 실패", "아이디 또는 비밀번호가 틀렸습니다."); }
        }

        const user = localStorage.getItem('minvote_user');
        const authSec = document.getElementById('auth-section');
        if(user) {
            authSec.innerHTML = `<span style="font-weight:700; margin-right:15px;">${user}님</span><button class="btn-pill" onclick="localStorage.removeItem('minvote_user'); location.reload();">Logout</button>`;
        } else {
            authSec.innerHTML = `<button class="btn-pill" onclick="toggleLoginModal(true)">Login</button>`;
        }
    </script>
</body>
</html>
